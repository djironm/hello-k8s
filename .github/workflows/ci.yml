name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node alertEvaluator.test.js

      - name: Run tests
        run: npm test
      - name: Build container image
        run: docker build -t hello-k8s:${{ github.sha }} .
      - name: Smoke-test container
        run: |
          docker run -d \
            --name hello-k8s-ci \
            -p 3000:3000 \
            hello-k8s:${{ github.sha }}

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
              sleep 1
          done

          docker logs hello-k8s-ci
          exit 1  
      - name: Clean up container
        if: always()
        run: docker rm -f hello-k8s-ci || true
